<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40" fill="none">
  <style>
    .wm { fill: #101114; }
    .sub { fill: #6B7280; }
    @media (prefers-color-scheme: dark) {
      .wm { fill: #F8FAFC; }
      .sub { fill: #94A3B8; }
    }
  </style>
  <g transform="translate(6, 6)">
    <!-- CJ Green Badge -->
    <rect x="0" y="2" width="26" height="26" rx="6" fill="#00A859"/>
    <text x="3" y="21" font-family="'Arial Black', Arial, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">CJ</text>
    <!-- Affiliate text -->
    <text x="34" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" class="wm" letter-spacing="-0.2">CJ AFFILIATE</text>
    <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" class="sub" letter-spacing="0.5">COMMISSION JUNCTION</text>
  </g>
</svg>
