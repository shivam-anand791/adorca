<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40" fill="none">
  <style>
    .wm { fill: #101114; }
    .accent { fill: #0D47A1; }
    @media (prefers-color-scheme: dark) {
      .wm { fill: #F8FAFC; }
      .accent { fill: #3B82F6; }
    }
  </style>
  <g transform="translate(6, 6)">
    <!-- ClickBank Emblem -->
    <circle cx="14" cy="14" r="14" fill="#0D47A1"/>
    <text x="5" y="19" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">CB</text>
    <!-- Wordmark -->
    <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" class="wm" letter-spacing="-0.3">CLICK<tspan class="accent">BANK</tspan></text>
  </g>
</svg>
