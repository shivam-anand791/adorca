<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40" width="150" height="40" fill="none">
  <style>
    .wm { fill: #101114; }
    @media (prefers-color-scheme: dark) {
      .wm { fill: #F8FAFC; }
    }
  </style>
  <g transform="translate(6, 6)">
    <!-- Outbrain "O" Orb Icon -->
    <circle cx="14" cy="14" r="12" stroke="#EE6529" stroke-width="3.5" fill="none"/>
    <circle cx="14" cy="6" r="3.5" fill="#EE6529"/>
    <!-- Wordmark -->
    <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" class="wm" letter-spacing="-0.3">outbrain</text>
  </g>
</svg>
